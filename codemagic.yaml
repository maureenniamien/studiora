workflows:
  android-workflow:
    name: Studiora Android
    max_build_duration: 60
    environment:
      node: 22
      java: 21
    scripts:
      - name: Install deps
        script: npm install
      - name: Sync Capacitor
        script: |
          test -d android || npx cap add android
          npx cap sync android
      - name: Patch AndroidManifest
        script: |
          python3 - << 'PYEOF'
          import re
          path = "android/app/src/main/AndroidManifest.xml"
          with open(path) as f:
              content = f.read()
          if 'usesCleartextTraffic' not in content:
              content = content.replace(
                  '<application',
                  '<application android:usesCleartextTraffic="true"',
              )
          if 'RECORD_AUDIO' not in content:
              content = re.sub(r'(<manifest[^>]*>)', r'\1\n    <uses-permission android:name="android.permission.RECORD_AUDIO" />', content, count=1)
          with open(path, 'w') as f:
              f.write(content)
          print("Patched OK")
          PYEOF
      - name: Build APK
        script: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
    artifacts:
      - android/app/build/outputs/apk/debug/app-debug.apk

  ios-workflow:
    name: Studiora iOS
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      node: 22
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install deps
        script: npm install @capacitor/ios@^8.4.0 && npm install
      - name: Add iOS platform
        script: |
          rm -rf ios
          npx cap add ios
          npx cap sync ios
          # Trouver le Podfile et noter son chemin
          echo "=== Structure ios ==="
          find ios -name "Podfile" 2>/dev/null || echo "Podfile non trouvé"
          find ios -name "*.xcworkspace" 2>/dev/null || echo "xcworkspace non trouvé"
      - name: Install CocoaPods
        script: |
          # Trouver le dossier contenant le Podfile
          PODFILE_DIR=$(dirname $(find ios -name "Podfile" | head -1))
          echo "Podfile trouvé dans: $PODFILE_DIR"
          cd "$PODFILE_DIR"
          pod install --repo-update
      - name: Build IPA
        script: |
          WORKSPACE=$(find ios -name "*.xcworkspace" | head -1)
          echo "Workspace: $WORKSPACE"
          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -archivePath build/App.xcarchive \
            archive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO
          PODFILE_DIR=$(dirname $(find ios -name "Podfile" | head -1))
          xcodebuild \
            -exportArchive \
            -archivePath build/App.xcarchive \
            -exportPath build/ipa \
            -exportOptionsPlist "$PODFILE_DIR/../exportOptions.plist" \
            || true
    artifacts:
      - build/App.xcarchive
      - build/ipa/*.ipa
