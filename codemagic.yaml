workflows:
  android-workflow:
    name: Studiora Android
    max_build_duration: 60
    environment:
      node: 18
      java: 17
    scripts:
      - name: Install deps
        script: npm install
      - name: Sync Capacitor
        script: |
          npx cap add android || true
          npx cap sync android
      - name: Build APK
        script: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
    artifacts:
      - android/app/build/outputs/apk/debug/app-debug.apk
