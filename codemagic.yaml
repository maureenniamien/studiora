workflows:
  android-workflow:
    name: Studiora Android
    max_build_duration: 60
    environment:
      node: 22
      java: 21
    scripts:
    - name: Install deps
      script: npm install
    - name: Sync Capacitor
      script: |
        npx cap add android || true
        npx cap sync android
    - name: Patch AndroidManifest
      script: |
        MANIFEST=android/app/src/main/AndroidManifest.xml
        sed -i 's/android:theme="@style\/AppTheme"/android:theme="@style\/AppTheme" android:usesCleartextTraffic="true"/' $MANIFEST
    - name: Build APK
      script: |
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug
