workflows:
  android-workflow:
    name: Studiora Android
    max_build_duration: 60
    environment:
      node: 22
      java: 21
    scripts:
      - name: Install deps
        script: npm install
      - name: Sync Capacitor
        script: |
          npx cap add android || true
          npx cap sync android
      - name: Patch AndroidManifest
        script: |
          python3 - << 'PYEOF'
          import re
          path = "android/app/src/main/AndroidManifest.xml"
          with open(path) as f:
              content = f.read()
          if 'usesCleartextTraffic' not in content:
              content = content.replace(
                  '<application',
                  '<application android:usesCleartextTraffic="true"',
              )
          with open(path, 'w') as f:
              f.write(content)
          print("Patched OK")
          PYEOF
      - name: Build APK
        script: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
    artifacts:
      - android/app/build/outputs/apk/debug/app-debug.apk

  ios-workflow:
    name: Studiora iOS
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      node: 22
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install deps
        script: npm install @capacitor/ios@^8.4.0 && npm install
      - name: Add iOS platform
        script: |
          # Supprimer l'ancien dossier ios s'il existe mais est incomplet
          if [ ! -f ios/App/Podfile ]; then
            rm -rf ios
            npx cap add ios
          fi
      - name: Sync Capacitor iOS
        script: npx cap sync ios
      - name: Install CocoaPods
        script: |
          cd ios/App
          pod install --repo-update
      - name: Build IPA
        script: |
          xcodebuild \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -archivePath build/App.xcarchive \
            archive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO
          xcodebuild \
            -exportArchive \
            -archivePath build/App.xcarchive \
            -exportPath build/ipa \
            -exportOptionsPlist ios/App/exportOptions.plist \
            || true
    artifacts:
      - build/App.xcarchive
      - build/ipa/*.ipa
