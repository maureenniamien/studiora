workflows:
  android-workflow:
    name: Studiora Android
    max_build_duration: 60
    environment:
      node: 22
      java: 21
    scripts:
      - name: Install deps
        script: npm install
      - name: Sync Capacitor
        script: |
          npx cap add android || true
          npx cap sync android
      - name: Patch AndroidManifest
        script: |
          python3 - << 'EOF'
          import re
          path = "android/app/src/main/AndroidManifest.xml"
          with open(path) as f:
              content = f.read()
          if 'usesCleartextTraffic' not in content:
              content = content.replace(
                  '<application',
                  '<application android:usesCleartextTraffic="true"',
                  1
              )
          with open(path, 'w') as f:
              f.write(content)
          print("Patched OK")
          EOF
      - name: Build APK
        script: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
    artifacts:
      - android/app/build/outputs/apk/debug/app-debug.apk
